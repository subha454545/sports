<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="theme-color" content="#ff0000">
<link rel="manifest" href="manifest.json">
<title>Sports Stream - Live Matches</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; font-family: 'Segoe UI', Arial, sans-serif; padding: 10px; min-height: 100vh; }
.country-header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: 30px;
    padding: 10px 20px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
.country-name { font-size: 18px; font-weight: bold; color: #ff6b6b; }
.country-flag { font-size: 14px; color: #888; }
.country-time { font-size: 11px; color: #888; }
.tabs-container {
    overflow-x: auto;
    scrollbar-width: none;
    margin-bottom: 15px;
}
.tabs-container::-webkit-scrollbar { display: none; }
.tabs { display: flex; gap: 8px; padding: 5px 0; }
.tab {
    background: #1a1a2e;
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
}
.tab.active { background: #ff0000; box-shadow: 0 2px 10px rgba(255,0,0,0.4); }
.horizontal-swipe {
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    display: flex;
    scroll-behavior: smooth;
}
.horizontal-swipe::-webkit-scrollbar { display: none; }
.tab-page {
    min-width: 100%;
    scroll-snap-align: start;
    overflow-y: auto;
    padding-right: 5px;
}
.match-card {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    border-left: 4px solid #ff0000;
}
.match-card.live-card {
    border-left: 4px solid #ff0000;
    box-shadow: 0 0 15px rgba(255,0,0,0.5);
    animation: blink 1s infinite;
}
@keyframes blink {
    0% { box-shadow: 0 0 0px rgba(255,0,0,0.3); }
    50% { box-shadow: 0 0 20px rgba(255,0,0,0.8); }
    100% { box-shadow: 0 0 0px rgba(255,0,0,0.3); }
}
.match-teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    font-weight: 600;
    color: white;
    flex-wrap: wrap;
    gap: 5px;
}
.match-sport { font-size: 11px; color: #ffaa66; margin-bottom: 8px; text-transform: uppercase; }
.match-time { font-size: 12px; color: #ff8888; text-align: center; margin-top: 8px; }
.match-date {
    font-size: 14px;
    font-weight: bold;
    color: #ffaa66;
    margin: 15px 0 8px 5px;
    padding-bottom: 5px;
    border-bottom: 1px solid #ffaa66;
    position: sticky;
    top: 0;
    background: #0a0a1a;
    z-index: 10;
}
.live-badge {
    background: #ff0000;
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 8px;
    animation: pulse 1s infinite;
}
.countdown-badge {
    background: #ff8800;
    color: white;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 8px;
}
.highlights-badge {
    background: #ffaa33;
    color: #1a1a2e;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 8px;
    font-weight: bold;
}
.waiting-badge { background: #555; color: #aaa; font-size: 10px; padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 8px; }
.multi-badge {
    background: #4caf50;
    color: white;
    font-size: 8px;
    padding: 2px 6px;
    border-radius: 10px;
    display: inline-block;
    margin-left: 8px;
}
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
.watch-btn, .countdown-btn, .highlights-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 25px;
    font-size: 12px;
    font-weight: bold;
    margin-top: 10px;
    width: 100%;
    cursor: pointer;
}
.watch-btn { background: #ff0000; color: white; }
.countdown-btn { background: #ff8800; color: white; }
.highlights-btn { background: #ffaa33; color: #1a1a2e; }
.loading { text-align: center; color: white; padding: 40px; }
.error { text-align: center; color: #ff6666; padding: 40px; }
.vs-text { color: #ffd700; font-size: 14px; font-weight: bold; margin: 0 8px; }
.loading-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
.loading-overlay.active { display: flex; }
.loading-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid #ff0000;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
.loading-text { color: white; margin-top: 15px; font-size: 14px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.video-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: 10000;
}
.video-overlay.active { display: block; }
.video-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
}
.video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}
.close-video-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: bold;
    z-index: 10001;
    cursor: pointer;
    backdrop-filter: blur(5px);
}
.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 20000;
    display: none;
}
.toast.show { display: block; animation: fadeInOut 2s ease; }
@keyframes fadeInOut { 0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* FIXED POPUP STYLES - Ensure visibility */
.link-popup {
    display: none !important;
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background: rgba(0,0,0,0.95) !important;
    z-index: 999999 !important;
    justify-content: center !important;
    align-items: center !important;
}
.link-popup.active { 
    display: flex !important; 
}
.link-popup-content {
    background: #1a1a2e !important;
    border-radius: 20px !important;
    padding: 25px !important;
    width: 85% !important;
    max-width: 350px !important;
    text-align: center !important;
    border: 2px solid #ff0000 !important;
    box-shadow: 0 0 30px rgba(255,0,0,0.5) !important;
}
.link-popup-content h3 { 
    color: #ffaa66 !important; 
    margin-bottom: 20px !important; 
    font-size: 20px !important;
}
.link-option {
    background: #ff0000 !important;
    color: white !important;
    border: none !important;
    padding: 14px !important;
    margin: 10px 0 !important;
    border-radius: 30px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    width: 100% !important;
    cursor: pointer !important;
}
.link-option:hover { 
    background: #cc0000 !important; 
}
.link-close { 
    background: #333 !important; 
    color: #aaa !important; 
    border: none !important; 
    padding: 12px !important; 
    margin-top: 15px !important; 
    border-radius: 30px !important; 
    width: 100% !important; 
    cursor: pointer !important;
    font-size: 14px !important;
}
</style>
</head>
<body>

<div class="country-header">
    <div>
        <div class="country-name">🇧🇩 BANGLADESH</div>
        <div class="country-time">Live Football · Live Sports</div>
    </div>
    <div class="country-flag">⚽ SPORTS</div>
</div>

<div class="tabs-container">
    <div class="tabs" id="tabs">
        <div class="tab active" data-filter="all" data-index="0">All Sports</div>
        <div class="tab" data-filter="football" data-index="1">⚽ Football</div>
        <div class="tab" data-filter="cricket" data-index="2">🏏 Cricket</div>
        <div class="tab" data-filter="tennis" data-index="3">🎾 Tennis</div>
        <div class="tab" data-filter="hockey" data-index="4">🏒 Hockey</div>
        <div class="tab" data-filter="others" data-index="5">🎯 Others</div>
    </div>
</div>

<div class="horizontal-swipe" id="horizontalSwipe">
    <div class="tab-page" id="page-all"></div>
    <div class="tab-page" id="page-football"></div>
    <div class="tab-page" id="page-cricket"></div>
    <div class="tab-page" id="page-tennis"></div>
    <div class="tab-page" id="page-hockey"></div>
    <div class="tab-page" id="page-others"></div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading stream...</div>
</div>

<div id="videoOverlay" class="video-overlay">
    <div class="video-container" id="videoContainer">
        <button class="close-video-btn" onclick="closeVideoPlayer()">✕ CLOSE</button>
        <iframe id="tvFrame" src="" allow="autoplay; fullscreen; encrypted-media" style="width:100%; height:100%; border:none;"></iframe>
    </div>
</div>

<!-- FIXED POPUP STRUCTURE -->
<div id="linkPopup" class="link-popup">
    <div class="link-popup-content">
        <h3>📺 SELECT STREAM</h3>
        <div id="linkList"></div>
        <button class="link-close" onclick="closeLinkPopup()">❌ CANCEL</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // ==================== STORAGE KEYS ====================
    const STORAGE_KEY = 'sports_events_data';
    const LAST_FETCH_KEY = 'last_fetch_time';
    const REFRESH_INTERVAL = 30 * 60 * 1000;
    const MATCH_DURATION = 7200;
    
    // ==================== COUNTRY FLAGS ====================
    const countryFlags = {
        'Morocco': '🇲🇦', 'Madagascar': '🇲🇬', 'Georgia': '🇬🇪', 'Romania': '🇷🇴',
        'Murcia': '🇪🇸', 'Barcelona': '🇪🇸', 'Haiti': '🇭🇹', 'New Zealand': '🇳🇿',
        'Belgium': '🇧🇪', 'Poland': '🇵🇱', 'Thailand': '🇹🇭', 'Serbia': '🇷🇸',
        'China': '🇨🇳', 'Czech Republic': '🇨🇿', 'Japan': '🇯🇵', 'Portugal': '🇵🇹',
        'GT': '🏏', 'RCB': '🏏', 'Bangladesh': '🇧🇩', 'India': '🇮🇳'
    };
    
    function getCountryFlag(name) {
        for (const [key, flag] of Object.entries(countryFlags)) {
            if (name.includes(key)) return flag;
        }
        return '🏆';
    }
    
    function formatMatchWithFlags(eventName) {
        if (eventName.includes(' vs ')) {
            const teams = eventName.split(' vs ');
            if (teams.length === 2) {
                return `${getCountryFlag(teams[0])} ${teams[0]} <span class="vs-text">VS</span> ${getCountryFlag(teams[1])} ${teams[1]}`;
            }
        }
        return eventName;
    }
    
    // ==================== GLOBAL VARIABLES ====================
    let allEvents = [];
    let eventsLoaded = false;
    
    const pages = {
        all: document.getElementById('page-all'),
        football: document.getElementById('page-football'),
        cricket: document.getElementById('page-cricket'),
        tennis: document.getElementById('page-tennis'),
        hockey: document.getElementById('page-hockey'),
        others: document.getElementById('page-others')
    };
    
    const tabFilters = ['all', 'football', 'cricket', 'tennis', 'hockey', 'others'];
    let currentTabIndex = 0;
    const tabs = document.querySelectorAll('.tab');
    const horizontalSwipe = document.getElementById('horizontalSwipe');
    const videoOverlay = document.getElementById('videoOverlay');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const iframe = document.getElementById('tvFrame');
    const toast = document.getElementById('toast');
    const linkPopup = document.getElementById('linkPopup');
    const linkList = document.getElementById('linkList');
    
    let isLoading = false;
    let loadTimeout = null;
    
    // ==================== UTILITIES ====================
    function showToastMessage(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }
    
    // FIXED: Close popup function
    window.closeLinkPopup = function() {
        console.log("Closing popup");
        if (linkPopup) {
            linkPopup.classList.remove('active');
        }
    };
    
    // FIXED: Show popup with stream links
    window.showStreamPopup = function(links) {
        console.log("Showing popup with", links.length, "links");
        
        if (!linkList) {
            console.error("linkList element not found");
            return;
        }
        
        linkList.innerHTML = '';
        
        links.forEach((link, index) => {
            const btn = document.createElement('button');
            btn.className = 'link-option';
            btn.textContent = `🎬 STREAM ${index + 1}`;
            btn.onclick = function() {
                console.log("Selected stream:", link);
                window.closeLinkPopup();
                window.openVideoPlayer(link);
            };
            linkList.appendChild(btn);
        });
        
        // Show the popup
        if (linkPopup) {
            linkPopup.classList.add('active');
            console.log("Popup activated");
        } else {
            console.error("linkPopup element not found");
        }
    };
    
    // FIXED: Single stream watch
    window.watchMatch = function(link) {
        console.log("Watch match single:", link);
        if (link && link.length > 0) {
            window.openVideoPlayer(link);
        } else {
            showToastMessage("❌ No stream link available");
        }
    };
    
    // FIXED: Multi stream watch - shows popup
    window.watchMatchMulti = function(link1, link2, link3) {
        console.log("Watch match multi called");
        var links = [];
        if (link1 && link1 !== 'undefined' && link1 !== '') links.push(link1);
        if (link2 && link2 !== 'undefined' && link2 !== '') links.push(link2);
        if (link3 && link3 !== 'undefined' && link3 !== '') links.push(link3);
        
        console.log("Links to show:", links);
        
        if (links.length === 0) {
            showToastMessage("❌ No stream links available");
            return;
        }
        
        if (links.length === 1) {
            window.openVideoPlayer(links[0]);
        } else {
            window.showStreamPopup(links);
        }
    };
    
    // ==================== MATCH FUNCTIONS ====================
    function getMatchStatus(timestamp) {
        const now = Math.floor(Date.now() / 1000);
        const matchStart = timestamp;
        const matchEnd = timestamp + MATCH_DURATION;
        if (now >= matchStart && now <= matchEnd) return 'live';
        else if (now >= matchStart - 600 && now < matchStart) return 'preview';
        else return 'upcoming';
    }
    
    function formatTime(timestamp) {
        const date = new Date(timestamp * 1000);
        let hours = date.getHours();
        const minutes = date.getMinutes();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const minutesStr = minutes < 10 ? '0' + minutes : minutes;
        return `${hours}:${minutesStr} ${ampm}`;
    }
    
    function formatDate(timestamp) {
        const date = new Date(timestamp * 1000);
        return date.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    
    function getSportIcon(sport) {
        const icons = { 
            'football': '⚽', 'cricket': '🏏', 'tennis': '🎾', 'hockey': '🏒', 
            'basketball': '🏀', 'volleyball': '🏐', 'default': '🎯'
        };
        return icons[sport.toLowerCase()] || icons.default;
    }
    
    function generateMatchCardHtml(event, status) {
        const formattedEvent = formatMatchWithFlags(event.event);
        const isLive = status === 'live';
        const liveClass = isLive ? 'live-card' : '';
        const linkCount = event.links ? event.links.length : 0;
        const multiBadge = linkCount > 1 ? '<span class="multi-badge">📺 MULTI</span>' : '';
        
        let badgeHtml = '', buttonHtml = '';
        
        // Escape links for JavaScript
        const escapedLinks = event.links.map(l => l.replace(/'/g, "\\'").replace(/"/g, '&quot;'));
        
        if (status === 'live') {
            badgeHtml = '<div class="live-badge">🔴 LIVE</div>';
            if (linkCount === 1) {
                buttonHtml = `<button class="watch-btn" onclick="window.watchMatch('${escapedLinks[0]}')">▶ WATCH LIVE</button>`;
            } else {
                const l1 = escapedLinks[0] || '';
                const l2 = escapedLinks[1] || '';
                const l3 = escapedLinks[2] || '';
                buttonHtml = `<button class="watch-btn" onclick="window.watchMatchMulti('${l1}','${l2}','${l3}')">▶ WATCH LIVE (${linkCount} LINKS)</button>`;
            }
        } else if (status === 'preview') {
            badgeHtml = '<div class="countdown-badge">⏰ STARTING SOON</div>';
            if (linkCount === 1) {
                buttonHtml = `<button class="countdown-btn" onclick="window.watchMatch('${escapedLinks[0]}')">🎬 JOIN WAITING ROOM</button>`;
            } else {
                const l1 = escapedLinks[0] || '';
                const l2 = escapedLinks[1] || '';
                const l3 = escapedLinks[2] || '';
                buttonHtml = `<button class="countdown-btn" onclick="window.watchMatchMulti('${l1}','${l2}','${l3}')">🎬 JOIN (${linkCount} LINKS)</button>`;
            }
        } else {
            badgeHtml = '<div class="waiting-badge">⏰ UPCOMING</div>';
            buttonHtml = '';
        }
        
        return `
            <div class="match-card ${liveClass}">
                <div class="match-sport">${getSportIcon(event.sport)} ${event.sport.toUpperCase()} ${multiBadge}</div>
                <div class="match-teams">${formattedEvent}</div>
                <div class="match-time">⏰ ${formatTime(event.timestamp)}</div>
                ${badgeHtml}
                ${buttonHtml}
            </div>
        `;
    }
    
    function renderPage(filter, pageElement) {
        if (!pageElement || !eventsLoaded) return;
        let filteredEvents = allEvents;
        if (filter !== 'all') {
            if (filter === 'others') {
                filteredEvents = allEvents.filter(e => !['football', 'cricket', 'tennis', 'hockey'].includes(e.sport.toLowerCase()));
            } else {
                filteredEvents = allEvents.filter(e => e.sport.toLowerCase() === filter);
            }
        }
        
        if (filteredEvents.length === 0) {
            pageElement.innerHTML = '<div class="error">⚠️ No events found.</div>';
            return;
        }
        
        const liveEvents = filteredEvents.filter(e => getMatchStatus(e.timestamp) === 'live');
        const previewEvents = filteredEvents.filter(e => getMatchStatus(e.timestamp) === 'preview');
        const upcomingEvents = filteredEvents.filter(e => getMatchStatus(e.timestamp) === 'upcoming');
        
        liveEvents.sort((a, b) => a.timestamp - b.timestamp);
        previewEvents.sort((a, b) => a.timestamp - b.timestamp);
        upcomingEvents.sort((a, b) => a.timestamp - b.timestamp);
        
        let html = '';
        
        if (liveEvents.length > 0) {
            html += `<div class="match-date">🔴 LIVE NOW</div>`;
            liveEvents.forEach(event => { html += generateMatchCardHtml(event, 'live'); });
        }
        
        if (previewEvents.length > 0) {
            html += `<div class="match-date">⏰ STARTING SOON</div>`;
            previewEvents.forEach(event => { html += generateMatchCardHtml(event, 'preview'); });
        }
        
        if (upcomingEvents.length > 0) {
            const grouped = {};
            upcomingEvents.forEach(e => { const date = formatDate(e.timestamp); if (!grouped[date]) grouped[date] = []; grouped[date].push(e); });
            for (const [date, events] of Object.entries(grouped)) {
                html += `<div class="match-date">🗓️ ${date}</div>`;
                events.forEach(event => { html += generateMatchCardHtml(event, 'upcoming'); });
            }
        }
        
        pageElement.innerHTML = html;
    }
    
    function renderAllPages() {
        if (!eventsLoaded) return;
        renderPage('all', pages.all);
        renderPage('football', pages.football);
        renderPage('cricket', pages.cricket);
        renderPage('tennis', pages.tennis);
        renderPage('hockey', pages.hockey);
        renderPage('others', pages.others);
    }
    
    // ==================== VIDEO PLAYER ====================
    
    function cleanStreamUrl(url) {
        try {
            const urlObj = new URL(url);
            const adParams = ['ad', 'ads', 'banner', 'popup', 'clickid', 'ref', 'source', 
                             'utm_source', 'utm_medium', 'affiliate', 'partner', 'sponsor'];
            adParams.forEach(param => urlObj.searchParams.delete(param));
            return urlObj.toString();
        } catch(e) {
            return url;
        }
    }
    
    window.openVideoPlayer = function(streamUrl) {
        console.log("Opening video player with URL:", streamUrl);
        
        if (!streamUrl || streamUrl === '') {
            showToastMessage("❌ Invalid stream URL");
            return;
        }
        
        let cleanUrl = cleanStreamUrl(streamUrl);
        
        if (loadTimeout) clearTimeout(loadTimeout);
        isLoading = true;
        loadingOverlay.classList.add('active');
        
        iframe.src = 'about:blank';
        
        setTimeout(() => {
            iframe.src = cleanUrl;
            console.log("🎬 Loading stream URL");
        }, 100);
        
        loadTimeout = setTimeout(() => {
            if (isLoading) {
                videoOverlay.classList.add('active');
                loadingOverlay.classList.remove('active');
                document.body.style.overflow = 'hidden';
                isLoading = false;
            }
        }, 3000);
        
        iframe.onload = () => {
            if (isLoading) {
                clearTimeout(loadTimeout);
                videoOverlay.classList.add('active');
                loadingOverlay.classList.remove('active');
                document.body.style.overflow = 'hidden';
                isLoading = false;
                console.log("✅ Stream loaded");
            }
        };
        
        iframe.onerror = () => {
            if (isLoading) {
                clearTimeout(loadTimeout);
                loadingOverlay.classList.remove('active');
                showToastMessage("❌ Failed to load stream");
                isLoading = false;
            }
        };
    };
    
    function closeVideoPlayer() {
        if (loadTimeout) clearTimeout(loadTimeout);
        isLoading = false;
        iframe.src = '';
        videoOverlay.classList.remove('active');
        loadingOverlay.classList.remove('active');
        document.body.style.overflow = '';
        showToastMessage("⏰ Video closed");
    }
    
    window.closeVideoPlayer = closeVideoPlayer;
    
    // ==================== AD BLOCKER ====================
    (function() {
        console.log("🛡️ Ad Blocker Active");
        
        window.open = function() { console.log("🚫 Popup blocked"); return null; };
        
        const originalAlert = window.alert;
        window.alert = function(msg) {
            const blockedKeywords = ['virus', 'win', 'click', 'prize', 'congratulations', 'winner', 'lottery'];
            if (msg && typeof msg === 'string' && blockedKeywords.some(keyword => msg.toLowerCase().includes(keyword))) {
                console.log("🚫 Alert blocked");
                return;
            }
            return originalAlert.call(window, msg);
        };
        
        let originalUrl = window.location.href;
        setInterval(function() {
            if (window.location.href !== originalUrl) {
                const newUrl = window.location.href.toLowerCase();
                const blockedUrls = ['virus', 'win', 'prize', 'click', 'ad', 'banner', 'casino'];
                if (blockedUrls.some(bad => newUrl.includes(bad))) {
                    console.log("🚫 Redirect blocked");
                    window.location.replace(originalUrl);
                } else {
                    originalUrl = window.location.href;
                }
            }
        }, 500);
        
        function removeAdElements() {
            const adSelectors = [
                'iframe[src*="ad"]', 'div[class*="ad"]', 'div[id*="ad"]', 
                '.advertisement', '.ads', 'ins.adsbygoogle'
            ];
            adSelectors.forEach(selector => {
                document.querySelectorAll(selector).forEach(el => { if (el && el.remove) el.remove(); });
            });
        }
        
        setInterval(removeAdElements, 1000);
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        
        console.log("✅ Ad Blocker Active");
    })();
    
    // ==================== LOAD DATA ====================
    async function fetchFreshData() {
        for (const page of Object.values(pages)) {
            if (page) page.innerHTML = '<div class="loading">📡 Loading events...</div>';
        }
        
        const now = Math.floor(Date.now() / 1000);
        allEvents = [
            { timestamp: now - 1800, sport: 'cricket', event: 'GT vs RCB', links: ['https://streamcrichd.com/update/willowextra.php'] },
            { timestamp: now + 300, sport: 'football', event: 'Morocco vs Madagascar', links: ['https://antenasport.org/movistarcampeones.php', 'https://antenasport2.org/stream1.php', 'https://antenasport3.org/stream2.php'] },
            { timestamp: now + 3600, sport: 'football', event: 'Georgia vs Romania', links: ['https://antenasport.org/movistarcampeones.php'] },
            { timestamp: now + 3600, sport: 'basketball', event: 'Murcia vs Barcelona', links: ['https://antenasport.org/movistarcampeones.php', 'https://alternate-stream.com/game.php'] },
            { timestamp: now + 7200, sport: 'tennis', event: 'ATP Masters Final', links: ['https://antenasport.org/movistarcampeones.php'] },
            { timestamp: now + 10800, sport: 'football', event: 'Haiti vs New Zealand', links: ['https://antenasport.org/movistarcampeones.php'] },
            { timestamp: now + 12600, sport: 'volleyball', event: 'Belgium vs Poland', links: ['https://antenasport.org/movistarcampeones.php'] },
            { timestamp: now + 16200, sport: 'volleyball', event: 'Thailand vs Serbia', links: ['https://antenasport.org/movistarcampeones.php'] },
            { timestamp: now + 19800, sport: 'volleyball', event: 'China vs Czech Republic', links: ['https://antenasport.org/movistarcampeones.php'] },
            { timestamp: now + 23400, sport: 'football', event: 'Japan U20 vs Portugal U20', links: ['https://antenasport.org/movistarcampeones.php'] }
        ];
        eventsLoaded = true;
        renderAllPages();
        showToastMessage(`✅ ${allEvents.length} events loaded`);
        console.log("Events loaded with multi-link support");
    }
    
    // ==================== SWIPE NAVIGATION ====================
    function switchToTab(index) {
        if (index < 0 || index >= tabFilters.length) return;
        currentTabIndex = index;
        tabs.forEach((tab, i) => {
            if (i === currentTabIndex) tab.classList.add('active');
            else tab.classList.remove('active');
        });
        horizontalSwipe.scrollTo({ left: horizontalSwipe.clientWidth * currentTabIndex, behavior: 'smooth' });
    }
    
    tabs.forEach((tab, index) => { tab.addEventListener('click', () => switchToTab(index)); });
    
    let startX = 0;
    horizontalSwipe.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
    horizontalSwipe.addEventListener('touchend', (e) => {
        if (!startX) return;
        const endX = e.changedTouches[0].clientX;
        const diffX = startX - endX;
        if (Math.abs(diffX) > 50) {
            if (diffX > 0 && currentTabIndex < tabFilters.length - 1) switchToTab(currentTabIndex + 1);
            else if (diffX < 0 && currentTabIndex > 0) switchToTab(currentTabIndex - 1);
        }
        startX = 0;
    });
    
    let scrollTimeout;
    horizontalSwipe.addEventListener('scroll', () => {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            const newIndex = Math.round(horizontalSwipe.scrollLeft / horizontalSwipe.clientWidth);
            if (newIndex !== currentTabIndex && newIndex >= 0 && newIndex < tabFilters.length) {
                currentTabIndex = newIndex;
                tabs.forEach((tab, i) => { if (i === currentTabIndex) tab.classList.add('active'); else tab.classList.remove('active'); });
            }
        }, 100);
    });
    
    // ==================== SERVICE WORKER ====================
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => {
            console.log('✅ Service Worker registered');
        }).catch(err => {
            console.log('❌ Service Worker failed:', err);
        });
    }
    
    // ==================== BACK BUTTON ====================
    let doubleBackPressed = false;
    let doubleBackTimer = null;
    
    document.addEventListener('backbutton', function(e) {
        if (linkPopup && linkPopup.classList.contains('active')) {
            e.preventDefault();
            window.closeLinkPopup();
            return;
        }
        if (videoOverlay.classList.contains('active')) {
            e.preventDefault();
            closeVideoPlayer();
            return;
        }
        if (doubleBackPressed) {
            clearTimeout(doubleBackTimer);
            doubleBackPressed = false;
            showToastMessage("👋 Exiting...");
            setTimeout(() => {
                if (navigator.app && navigator.app.exitApp) navigator.app.exitApp();
                else window.close();
            }, 100);
        } else {
            doubleBackPressed = true;
            showToastMessage("⚠️ Press BACK again to exit");
            doubleBackTimer = setTimeout(() => { doubleBackPressed = false; }, 2000);
            e.preventDefault();
        }
    });
    
    // ==================== INITIALIZE ====================
    fetchFreshData();
    setInterval(() => { if (eventsLoaded && !videoOverlay.classList.contains('active')) renderAllPages(); }, 10000);
    setTimeout(() => { horizontalSwipe.scrollLeft = 0; }, 100);
    console.log('✅ Sports App Ready - Stream Popup Working');
</script>
